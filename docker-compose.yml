services:
  postgres-db:
    image: postgres:16
    container_name: rental_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: rental_db
    ports:
      - "5432:5432"
    volumes:
      - rental_pg_data:/var/lib/postgresql/data

volumes:
  rental_pg_data: